  <!-- Chopsticks -->
  <g stroke-linecap="round">
    <line x1="330" y1="70" x2="215" y2="285" stroke="#f6e3c3" stroke-width="20"/>
    <line x1="400" y1="95" x2="250" y2="290" stroke="#f6e3c3" stroke-width="20"/>
  </g>
  <!-- Heaping plate of food -->
  <ellipse cx="256" cy="290" rx="150" ry="58" fill="#ffffff"/>
  <circle cx="190" cy="268" r="46" fill="#e8a33d"/>
  <circle cx="262" cy="252" r="56" fill="#f2b453"/>
  <circle cx="328" cy="272" r="40" fill="#d9822b"/>
  <circle cx="230" cy="222" r="20" fill="#6aa84f"/>
  <circle cx="300" cy="226" r="16" fill="#6aa84f"/>
  <!-- Bowl -->
  <path d="M86 292 H426 A170 150 0 0 1 86 292 Z" fill="#1f1a17"/>
  <rect x="186" y="430" width="140" height="22" rx="11" fill="#1f1a17"/>
